# kali-rdp-kit tmux defaults
#
# The problem this solves: when several clients attach to one tmux session,
# tmux renegotiates the window to the smallest attached client on every
# attach/detach. Over RDP -- where reconnects are frequent and client sizes
# differ -- that shows up as redraw corruption and stale rows.

# Size windows to the *session*, not to whichever client is smallest.
set -g window-size manual
setw -g aggressive-resize on

# Terminal capability negotiation over RDP is often incomplete; pin it.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc"

# Escape delay confuses editors over a laggy RDP link.
set -sg escape-time 10

set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Detach any other client when attaching, so one session has one viewer.
# Comment this out if you deliberately want shared/observer sessions.
bind-key S attach-session -d

# Show the session name; useful when reconnecting and wondering what you have.
set -g status-left "[#S] "
set -g status-left-length 30
