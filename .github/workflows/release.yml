name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot lintian

      - name: Check the tag matches the source version
        run: |
          src=$(awk -F'"' '/^KRK_VERSION=/{print $2}' lib/common.sh)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$src" != "$tag" ]; then
            echo "tag $tag does not match KRK_VERSION $src in lib/common.sh" >&2
            exit 1
          fi
          echo "version $src"

      - name: Build .deb
        run: ./packaging/build-deb.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: a tag can be re-pointed (a corrected message, a history
          # rewrite), which re-fires this workflow. Refresh the assets rather
          # than failing the run on an already-published release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; refreshing assets"
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
